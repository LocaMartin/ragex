name: Continuous Domain Processing

on:
  schedule:
    - cron: '0 0 * * *' # Runs once a day automatically
  workflow_dispatch:      # Allows you to trigger it manually from the UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # FIX 1: Grant explicit write permissions to the runner token
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Dependencies
      run: |
        go install github.com/tomnomnom/waybackurls@latest
        echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: Run Processing Script
      run: ./run_scan.sh

    - name: Run Regex Scanner
      run: |
        # Extract .js URLs from compressed waybackurls and run ragex.js on a subset to avoid extreme runtimes
        if [ -f waybackurls.txt.gz ]; then
          gzip -dc waybackurls.txt.gz | grep '\.js$' | head -n 50 | node ragex.js > matches.txt
        else
          echo "No waybackurls.txt.gz found" > matches.txt
        fi

    - name: Commit and Push Progress
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # Save compressed output, not huge raw txt
        git rm --ignore-unmatch --cached waybackurls.txt || true
        git add waybackurls.txt.gz resume.cfg matches.txt index.html

        if ! git diff-index --quiet HEAD --; then
          git commit -m "Update scan progress and matches"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No progress changes to commit."
        fi
