#!/usr/bin/env bash

INPUT_FILE="all.txt"
OUTPUT_GZ="waybackurls.txt.gz"
STATE_FILE="resume.cfg"

# Force restart clean scan by default if requested
if [ "$1" == "--restart" ] || [ ! -f "$OUTPUT_GZ" ]; then
    echo "[+] Cleaning up previous scans and restarting from line 0..."
    rm -f "$OUTPUT_GZ" "$STATE_FILE" waybackurls.txt
    START_LINE=0
else
    START_LINE=0
    if [ -f "$STATE_FILE" ]; then
        EXTRACTED_INDEX="$(grep -E '^index=' "$STATE_FILE" | cut -d'=' -f2)"
        if [[ "$EXTRACTED_INDEX" =~ ^[0-9]+$ ]]; then
            START_LINE="$EXTRACTED_INDEX"
        fi
    fi
    echo "[+] Resuming scan from index line: $START_LINE"
fi

START_TIME="$(date +%s)"
MAX_DURATION=19800 # 5.5 hours

CURRENT_LINE=0

# Temporary uncompressed storage before deduping/cleaning
TMP_OUT="$(mktemp)"

if [ -f "$OUTPUT_GZ" ]; then
    gzip -dc "$OUTPUT_GZ" > "$TMP_OUT" 2>/dev/null || true
fi

while IFS= read -r host || [ -n "$host" ]; do
    CURRENT_LINE=$((CURRENT_LINE + 1))

    if [ "$CURRENT_LINE" -le "$START_LINE" ]; then
        continue
    fi

    host="$(printf '%s' "$host" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"

    if [ -n "$host" ]; then
        echo "[+] Processing [$CURRENT_LINE]: $host"
        echo "$host" | waybackurls >> "$TMP_OUT"
    fi

    NOW="$(date +%s)"
    ELAPSED=$((NOW - START_TIME))

    if [ "$ELAPSED" -ge "$MAX_DURATION" ]; then
        echo "[!] Approaching time limit. Saving checkpoint..."
        echo -e "resume_from=$host\nindex=$CURRENT_LINE" > "$STATE_FILE"
        break
    fi
done < "$INPUT_FILE"

if [ "$CURRENT_LINE" -ge "$(wc -l < "$INPUT_FILE")" ]; then
    echo -e "resume_from=DONE\nindex=$CURRENT_LINE" > "$STATE_FILE"
fi

# Clean, deduplicate, and push directly to .gz
awk '
{
    gsub(/\r/, "")
    sub(/^[[:space:]]+/, "")
    sub(/[[:space:]]+$/, "")
    if ($0 != "") print
}
' "$TMP_OUT" | LC_ALL=C sort -u | gzip -9 -c > "$OUTPUT_GZ"

rm -f "$TMP_OUT"

echo "[+] Cleaned & compressed output updated at $OUTPUT_GZ"
